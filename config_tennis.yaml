# Tennis Lab Sandbox Config — overrides config.yaml for tennis-only paper trading
# Spec: docs/superpowers/specs/2026-05-19-tennis-prediction-lab-design.md

mode: paper
initial_bankroll: 1000

cycle:
  heavy_interval_min: 30
  light_interval_sec: 5
  night_interval_min: 60

scanner:
  min_liquidity: 1000
  max_markets_per_cycle: 500
  # Polymarket tennis end_date'i match_start + ~7 gün (turnuva sonu cushion).
  # 7 gün cutoff bugünün maçlarını saatlerce kıl payıyla eler — 10 güne çıkarıyoruz.
  max_duration_days: 10
  # 3 güne çıkarıldı: bugünün maçları + 2 gün discovery (Stage 0 PLAN-TENNIS-001).
  max_hours_to_start: 72.0
  max_post_start_hours: 1.0
  resolved_price_threshold: 0.98
  allowed_categories: [sports]
  # Gamma client slug-prefix override ile atp-/wta- → "tennis" normalize ediyor;
  # "atp" tag'i ölü kayıt, "tennis" yeterli.
  allowed_sport_tags:
    - tennis
  # Polymarket'in gerçek sports_market_type değerleri (debug script gözlemi):
  # tennis_first_set_winner, tennis_set_handicap, tennis_set_totals (3 alt market),
  # moneyline (match winner, ~89 markets), tennis_match_totals (~105 markets).
  # tennis_completed_match/tennis_first_set_totals → predictor yok, desteklenmiyor.
  allowed_sports_market_types:
    - tennis_first_set_winner
    - tennis_set_handicap
    - tennis_set_totals
    - moneyline
    - tennis_match_totals

edge:
  # Sandbox edge threshold deliberately relaxed (vs main bot 0.06) for exploratory data —
  # tennis alt markets are inefficient (no bookmaker), expected raw edge smaller but more frequent.
  min_edge: 0.05
  confidence_multipliers: {A: 1.00, B: 1.00}
  # 2026-05-26: Data-driven entry exclusions (51 closed trade analysis).
  # ATP_set_totals B: 2W/10L, -$14.93 EV/trade, -$179 net. Clear negative signal.
  # WTA_set_totals B (+$8 EV) and ATP_set_handicap B (+$5 EV) left enabled.
  exclude_combos:
    - tour: atp
      market_type: tennis_set_totals
      confidence: B

risk:
  # Bankroll $1000 — A non-bimodal $50 (5%), B non-bimodal $35 (3.5%), bimodal A/B $15 cap.
  # PLAN-SIZING-001 (2026-05-22): /3 küçültme kaldırıldı, bimodal cap'ler $15.
  max_single_bet_usdc: 50
  # Bimodal market override'ları — SL fire etmiyor, full loss riski (4/6 set_totals trade -$40+ kayıp).
  # Tek-trade max kaybı $20 (kullanıcı risk toleransı, 2026-05-24 $15→$20).
  set_totals_max_usdc: 20
  set_handicap_max_usdc: 20
  max_bet_pct: 0.05
  # B = 3.5% (kullanıcı tercihi: bankroll $1000 → B non-bimodal $35).
  confidence_bet_pct: {A: 0.05, B: 0.035}
  max_positions: 20
  # 3 alt market açık olabilir aynı maçta (first_set_winner / set_handicap / set_totals + ML/match_o_u).
  # Tennis entry strategy en yüksek |edge|'leri seçer (DECISIONS §6.18).
  max_positions_per_event: 3
  max_exposure_pct: 0.60
  hard_cap_overflow_pct: 0.02
  min_entry_size_pct: 0.02
  max_entry_price: 0.88
  stop_loss_pct: 0.30
  # Bimodal markets exempt from simple stop_loss — price routinely swings >30%
  # between sets (set_handicap shnaide-zarazua case) or moves on set outcomes
  # independent of bet thesis (totals lines). graduated_sl (elapsed-aware) remains
  # active. Single source of truth — replaces SPEC-V era _TOTALS_KEYWORDS keyword
  # check in stop_loss.py (drift cleanup 2026-05-26).
  stop_loss_exempt_market_types:
    - tennis_set_handicap
    - tennis_set_totals
    - tennis_match_totals
    - tennis_first_set_totals

circuit_breaker:
  # Paper trading context — no real capital at risk, CB disabled intentionally.
  # Re-enable to true if this config is ever adapted for live mode.
  enabled: false
  daily_max_loss_pct: -0.10
  hourly_max_loss_pct: -0.07
  consecutive_loss_limit: 5

dashboard:
  enabled: true
  host: 127.0.0.1
  port: 5051

telegram:
  enabled: false
  bot_token: ""
  chat_id: ""

agent:
  cycle_max_consecutive_errors: 2

score:
  enabled: true
  poll_normal_sec: 60
  poll_critical_sec: 30
  critical_price_threshold: 0.35

price_feed:
  max_spike_pct: 0.50
  max_spread_for_near_resolve: 0.10

tennis:
  data_dir: "data/sackmann_cache"
  tml_dir: "data/tml_cache"
  ratings_cache: "data/tennis_ratings.json"
  diagnostic_log_dir: "logs/tennis_diagnostics"
  sackmann_years: [2022, 2023, 2024, 2025, 2026]
  challenger_years: [2022, 2023, 2024, 2025, 2026]
  sackmann_wta_years: [2022, 2023, 2024, 2025, 2026]
  glicko_initial_rating: 1500
  glicko_initial_rd: 350
  glicko_initial_volatility: 0.06
  glicko_tau: 0.5
  confidence_tier_a:
    min_matches_12mo: 40
    min_surface_matches: 15
    min_h2h_years: 5
    max_form_age_days: 60
    max_glicko_rd: 100
  confidence_tier_b:
    min_matches_12mo: 20
    min_surface_matches: 8
    max_form_age_days: 90
    max_glicko_rd: 150
