# config.yaml — Polymarket Agent 2.0 v2 defaults (DECISIONS §9)
mode: paper  # dry_run | paper | live  (2026-05-29 Phase 3: paper default)
initial_bankroll: 1000.0

cycle:
  heavy_interval_min: 25
  light_interval_sec: 5
  night_interval_min: 60
  night_hours: [8, 9, 10, 11, 12, 13]

scanner:
  min_liquidity: 1000
  max_markets_per_cycle: 500  # SPEC-Y8 (2026-05-24): 30 → 500. MLB submarket engine
                              # devre disi (mlb_submarket.enabled=false), bottleneck yok.
                              # 24 saatteki TUM eligible maclari incelesin (su an ~268).
  max_duration_days: 14
  # Maç bu kadar saatten uzaksa Odds API h2h verisi yok → scanner'da ele
  max_hours_to_start: 24.0
  # Maç başladıktan sonra max kabul (canlı entry penceresi) (SPEC-B)
  max_post_start_hours: 8.0
  # yes_price >= bu veya <= (1 - bu) → market sonucu belli, skip (Polymarket flag lag)
  resolved_price_threshold: 0.98
  # Tennis match_start ESPN override icin cache TTL (saniye); 300 = 5dk.
  tennis_start_cache_ttl_sec: 300
  tennis_athlete_cache_ttl_sec: 86400
  # SPEC-Z14 (2026-06-03): ESPN fetch lookahead (bugun + N gun). Polymarket
  # gameStartTime ±1 gun yanlis olabiliyordu (Wendelken-Lajal 06-03 vs 06-04).
  tennis_espn_lookahead_days: 3
  allowed_categories: ["sports"]
  # Gamma event.tags[*].slug formatı (Odds API key ≠ Gamma tag).
  # Odds API mapping domain/matching/odds_sport_keys.py'de ayrı yapılır.
  # 2026-05-29 (Phase 3 follow-up): tennis-paper-lab parity. Polymarket tennis
  # market_type'ları kabul edilen tipler. Basket için legacy moneyline/spreads/
  # totals zaten içeride; tennis için ek 4 tip.
  allowed_sports_market_types:
    - moneyline
    - spreads
    - totals
    - tennis_first_set_winner
    - tennis_set_handicap
    - tennis_set_totals
  allowed_sport_tags:
    # 2026-05-29 (unified paper lab Phase 3): basket + tenis (final portföy).
    # Phase 1'de daraltıldı, Phase 3'te tennis (atp/wta) eklendi.
    # Basketball
    - nba
    - wnba
    - ncaab
    - wncaab
    - cbb
    - euroleague
    - nbl
    # SPEC-EUROBASKET-001 (2026-06-02): Avrupa basket. ACB + BSL + Lega + VTB scraper aktif.
    # VTB eurobasket.com'dan scrape edilir (vtb-league.com dinamik JS).
    - liga_acb
    - turkey_bsl
    - italy_lega
    - vtb
    # Tennis (Phase 3 — paper realism + Sackmann refresher hazır)
    # FIX 2026-05-29: Polymarket gamma event-level sport_tag "tennis" döner
    # ("atp"/"wta" sadece /sports endpoint sport_code'unda, event tag'lerinde
    # değil). Whitelist "tennis" olmalı yoksa scanner 949 tennis market'i hep
    # reddediyor. atp/wta backup olarak kalır (sport_tag override değişirse).
    - tennis
    - atp
    - wta

edge:
  min_edge: 0.06
  confidence_multipliers:
    A: 1.00    # 19 Apr peak değer (önceki 1.25)
    B: 1.00
  # 2026-05-29 (Phase 3): tennis paper lab 97 trade analizi (post-spike-removal):
  #   tennis_set_totals -$63 net, tennis_first_set_winner -$162 net.
  #   Sackmann modeli %16/%56 doğru, market %72/%69 → modele güvenilmez.
  # tennis_set_handicap (+$2), moneyline açık tutuluyor.
  # 2026-06-09 (SPEC-Z28): tennis_match_totals TAMAMEN KALDIRILDI (allowed_sports_market_types'tan
  #   çıkarıldı). Kendi modelimiz O/U'da %38 isabet (-$45). Bahisçi totals tenis için sadece
  #   büyük turnuvaları kapsıyor (akışımızın ~%8'i) → bahisçiye bağlamak da işe yaramaz. Market kapalı.
  exclude_combos:
    - {tour: atp, market_type: tennis_set_totals, confidence: A}
    - {tour: atp, market_type: tennis_set_totals, confidence: B}
    - {tour: wta, market_type: tennis_set_totals, confidence: A}
    - {tour: wta, market_type: tennis_set_totals, confidence: B}
    - {tour: atp, market_type: tennis_first_set_winner, confidence: A}
    - {tour: atp, market_type: tennis_first_set_winner, confidence: B}
    - {tour: wta, market_type: tennis_first_set_winner, confidence: A}
    - {tour: wta, market_type: tennis_first_set_winner, confidence: B}
    # SPEC-Z10 (2026-06-03): 4 Avrupa basket lig için bimodal market'leri kapatıldı.
    # Sebep: Avrupa scraper'lar sadece skor parse ediyor, possessions verisi YOK
    # (NBA box score FGA/FTA/OREB/TOV gibi). Pace×Eff modeli sönük input alıyor
    # (tüm takım sabit 75 poss) → totals/spreads tahmin DANDİK olur.
    # Kullanıcı kararı (2026-06-03): "uydurma tahmin entegre etmek istemiyorum,
    # NBA kadar iyi tahminler istiyorum, yapamıyorsak ML yeterli". Bu lig'lerde
    # SADECE ML (Elo bazlı, sağlam) trade edilir. Euroleague + Eurocup için
    # box score var (euroleague-api), bunlar etkilenmez.
    - {tour: bkligend, market_type: totals, confidence: null}
    - {tour: bkligend, market_type: spreads, confidence: null}
    - {tour: bkbsl, market_type: totals, confidence: null}
    - {tour: bkbsl, market_type: spreads, confidence: null}
    - {tour: bkseriea, market_type: totals, confidence: null}
    - {tour: bkseriea, market_type: spreads, confidence: null}
    - {tour: bkvtb, market_type: totals, confidence: null}
    - {tour: bkvtb, market_type: spreads, confidence: null}

risk:
  # SPEC-P (2026-05-21): sabit-tier sizing. Bankroll dalgalanmasından bağımsız.
  # SPEC-U (2026-05-23): bimodal-aware. Non-bimodal (moneyline) = fixed_bet_usdc;
  # bimodal (totals + spreads — anlık fiyat çakılma riski, SL muaf) = bimodal_bet_usdc.
  # Tenis lab pattern (set_totals + set_handicap için ayrı cap).
  fixed_bet_usdc:        # non-bimodal (moneyline)
    A: 50
    B: 30
  bimodal_bet_usdc:      # bimodal (totals + spreads) — tenis paritesi
    A: 15
    B: 10
  max_positions: 50        # Kozmetik cap — pratikte exposure cap dominant
  max_positions_per_event: 3  # ARCH Kural 8 (gevşedi): aynı event'te max 3 bağımsız market (moneyline + spread + totals)
  # Yumuşak cap: exposure < %50 iken tam trade alınır (cap'i geçebilir).
  # Exposure ≥ %50 → yeni trade reddedilir. Clipping yok.
  max_exposure_pct: 0.50
  # 2026-06-07 (SPEC-Z23): 0.88 → 0.75. Yüksek-fiyat favoriler asimetrik risk:
  # 0.81 entry → ~%23 upside ama %100 downside ($50 riske ~$12 kazanç). Düşük
  # entry'de upside büyük (0.99'a yol var, sorun yok); yüksek entry'de R/R kötü.
  # Cap 0.75 (slippage buffer ile efektif ~0.74) → asimetrik favoriler kesilir.
  max_entry_price: 0.75
  # Gate ile executor arası slippage buffer — order book delik olmasın.
  # effective_price + buffer >= cap ise reddet.
  entry_price_slippage_buffer: 0.01
  # Belirsizlik filtresi — tenis modeli "fifty-fifty" derken trade etme.
  # 5w3l veri analizi: 3 kaybın 3'ü de anchor 0.40-0.60 arasındaydı.
  model_min_anchor_distance_from_half: 0.10
  # PLAN-001 (2026-06-01): Anti-edge guard. Consensus stratejisi edge'i
  # "0.99 - entry_price" diye hesaplıyor — model-piyasa açıklığını umursamıyor.
  # Cobolli (0.86 vs model 0.63) tipi negatif-EV trade'leri kesmek için 2 kural:
  # A: paid_price ≥ threshold VE anti_edge > tolerance → SKIP (yüksek fiyat asimetri)
  # B: anti_edge > absolute_max → SKIP (büyük model-fiyat uçurumu, fiyat fark etmez)
  # anti_edge = paid_price - model_fair_for_chosen_side.
  anti_edge_high_price_threshold: 0.80
  anti_edge_high_price_tolerance: 0.00
  anti_edge_absolute_max: 0.15
  # SPEC-X (2026-05-24): bimodal (totals + spreads) entry alt sınır — ultra-low fiyat
  # bu market'lerde "piyasa kararını vermiş" sayılır.
  bimodal_min_entry_price: 0.20
  consecutive_loss_cooldown: 3
  cooldown_cycles: 2
  stop_loss_pct: 0.30
  # Tennis H2H Glicko/Markov blend ağırlığı (0.6 = Glicko ağır).
  tennis_h2h_glicko_weight: 0.6
  # 2026-06-01 (kullanıcı sadeleştirme): lig fark etmiyor, market scope önemli.
  # Quarter/period market'leri kısa scope → 120dk; full maç market'leri → 480dk.
  # Bid yoksa pozisyon HOLD (no-bid 0-sat YASAK, Polymarket resolve etsin).
  # MLB UMA dispute istisnası kaldırıldı — bid yoksa hold zaten otomatik koruyor.
  # Saf güvenlik ağı — normal SL/TP zincirine etki yok.
  force_close_timeouts:
    # Quarter/period markets (kısa scope, ~12dk gerçek market süresi)
    nba_quarter_1_winner: 120
    nfl_quarter_1: 120
    # Full maç markets (lig fark etmez — hepsi maç süresi + 5-6 saat buffer)
    nba_match_winner: 480
    nfl_match_winner: 480
    nhl_match_winner: 480
    mlb_match_winner: 480
    wnba_match_winner: 480
    moneyline: 480
    totals: 480
    spread: 480
    default: 480
  # 2026-05-28: Polymarket otomatik resolution detector. Her N light tick'te bir
  # acik pozisyon gamma'da sorgulanir (closed + umaResolutionStatus=resolved →
  # exit @ owned-side payout). 5sn × 60 = 5dk per pozisyon. 0 → kapali.
  polymarket_resolution_check_every_n_ticks: 60

early:
  enabled: true
  max_slots: 2
  max_entry_price: 0.70
  min_edge: 0.10
  min_anchor_probability: 0.55
  min_confidence: "B"
  bookmaker_pre_screen_edge: 0.08
  min_hours_to_start: 6.0
  max_hours_to_start: 24.0
  bet_pct: 0.05
  stop_loss_pct: 0.30

consensus:
  enabled: true
  min_price: 0.60
  bet_pct: 0.05
  max_slots: 5
  # SPEC-Z13 (2026-06-03): direction-adjusted model edge guard. Default 0.0 =
  # negatif model edge consensus yasak. SPEC-Z14 ile birlikte favorite_band
  # aralığında bu kural bypass edilir.
  min_model_edge: 0.0
  # SPEC-Z14 (2026-06-04 revize): favorite-band, direction-adjusted MODEL OLASILIĞI
  # üzerinden. Botun seçtiği taraf için tahmini kazanma olasılığı [min, max)
  # aralığındaysa min_model_edge bypass. Önceki sürüm entry_price üzerindeydi —
  # kullanıcı "güven bandı" semantiğini istedi (06-04). Anti_edge_absolute_max aktif.
  favorite_band_min_prob: 0.60
  favorite_band_max_prob: 0.80

stock:
  enabled: true
  jit_batch_multiplier: 3       # empty_slots × bu = her cycle enrich edilecek tavan
  ttl_hours: 24.0               # first_seen üzerinden stock'ta kalma limiti
  pre_match_cutoff_min: 30.0    # match_start'a bu dk kala düş
  max_no_edge_attempts: 3       # peş peşe bu kadar no_edge → düş

graduated_sl:
  # 2026-06-01: ESPN ile dogrulanmis 27 trade analizi notu vardi — ama bu botta
  # dogrulanamadi (eski tennis-paper-lab arsivi mevcut degil). Watt-Wendelken 2.
  # pozisyonu graduated_sl ile -$10.48 zarar ettirdi; partial_sl zaten kademeli
  # kapatma yapiyor. Cifte loss management gereksiz.
  # 2026-06-02 KAPATILDI: tek loss management = partial_sl (kademeli). graduated
  # tam-cikis hatti silindi — eger yine ihtiyac olursa flag tekrar true yeterli.
  enabled: false

partial_sl:
  # 2026-06-01: Loss-side partial exits (scale-out'un simetriği).
  # Eski tam SL: %30 düşünce hepsini sat → geçici dipte tüm pozisyonu kaybediyoruz.
  # Yeni 3-tier: erken küçük çıkış, sonra escalate, son çare tam çıkış.
  # 2026-06-02: Tek-bot kararı — partial_sl AÇIK, graduated_sl KAPALI. Lab ayrı
  # process olarak çalıştırılmıyor; iki konfig fark partial vs graduated A/B test
  # gereği kalktı. Loss management = sadece kademeli partial_sl.
  enabled: true
  tiers:
    - loss_threshold: 0.20    # %20 düşünce -> %30 sat (suları test et)
      sell_pct: 0.30
    - loss_threshold: 0.35    # %35 düşünce -> kalanın %50 sat (escalate)
      sell_pct: 0.50
    - loss_threshold: 0.50    # %50 düşünce -> kalanı tamamen sat (kabul et)
      sell_pct: 1.00

scale_out:
  enabled: true
  # 2026-06-03 (SPEC-Z12): 0.25/0.50 → 0.40/0.70 (25 May config restore).
  # Kullanıcı kararı: 25 Mayıs'ta avg win $17, MaxW $20, +$184 NET. Bugün config
  # (0.25/0.50) avg win $5'e düştü — büyük kazançları kısıtlıyordu.
  # 25 May'daki büyük loss günlerinin (24/30/31 May) kök sebebi tam SL'de yanma
  # idi; partial_sl AÇIK bırakılarak bu risk azaltıldı (Azkara tipi pozisyon
  # toparlanma şansı verir, tam loss yerine kademeli).
  # distance-to-resolution: progress = (cur-entry)/(1-entry); tier fires when
  # progress >= threshold. Scale-invariant (19¢ ve 80¢ entry'ler aynı oranda).
  tiers:
    - threshold: 0.40    # 40% of way from entry to $1 -> sell 40%
      sell_pct: 0.40
    - threshold: 0.70    # 70% of way -> sell 50% of remaining
      sell_pct: 0.50
  # 2026-06-03 (SPEC-Z12 + kullanıcı "hepsi için olsun"): high_entry özel
  # davranışı kaldırıldı. 25 May'da yoktu; tek tier seti tüm entry fiyatları
  # için aynı. 0.70-0.88 entry de standart 0.40/0.70 tier'larıyla işler.
  high_entry_threshold: 0.0
  high_entry_upper: 0.0

circuit_breaker:
  # TEST MODU: CB devre dısı (2026-05-13). Multi-SL (graduated + flat + market_flip)
  # zaten maç-içi koruma sağlıyor; CB ardısık 4 kayıpta tüm liglerden 60dk blok
  # uyguluyordu — bağımsız maçlar arası gereksiz blok. Gözlem sonu yeniden açılır.
  enabled: false
  daily_max_loss_pct: -0.08
  hourly_max_loss_pct: -0.05
  consecutive_loss_limit: 4
  cooldown_after_daily_min: 120
  cooldown_after_hourly_min: 60
  cooldown_after_consecutive_min: 60
  entry_block_threshold: -0.03
  # Dashboard Loss Protection renk bölgeleri (drawdown %)
  safe_drawdown_pct: 15.0
  warn_drawdown_pct: 30.0

manipulation:
  min_liquidity_usd: 10000

liquidity:
  entry_min_depth_usdc: 100
  entry_halve_threshold: 0.20
  exit_min_fill_ratio: 0.80

near_resolve:
  threshold_cents: 94
  pre_match_guard_minutes: 10   # WS spike guard — ilk 10dk'da 94¢ sinyali gerçek değil, spike

favored:
  promote_eff_price: 0.65
  demote_eff_price: 0.65
  conf_required: ["A", "B"]

dashboard:
  enabled: true
  host: "127.0.0.1"
  port: 5050

telegram:
  # 2026-06-02 SPEC-TG-001: alert sistemi aktif. Token/chat_id .env'den okunur
  # (TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID); ikisi de varsa enabled auto-True
  # (settings.py:381-388). enabled=false bıraksak bile .env varsa yine açılır.
  enabled: true
  bot_token: ""       # .env override
  chat_id: ""         # .env override
  alert:
    # Her trade için entry/exit telegram mesajı (yoğun trade'de sessize alabilirsin)
    entry_exit: true
    # HealthMonitor periyodik check sıklığı (saniye); 300 = 5dk
    health_check_interval_sec: 300
    # Son 1 saatte STALE_PRICE_REJECT >= bu eşik → warning
    stale_price_rate_threshold: 5
    # Exposure %90+ bu kadar dakikadır kilitli → warning
    exposure_lockup_minutes: 60
    # Ardışık zarar (audit'ten okunur) → warning
    consecutive_losses: 5
    # Günlük özet saati (UTC); 20 = 23:00 TR
    daily_summary_hour_utc: 20
    # Aynı alert N dk içinde tekrar gönderilmez (spam engellenir)
    dedupe_window_minutes: 30
    # Tennis calibration N gün+ eski → info alert (refresh önerilir)
    calibration_stale_days: 7
    # Veri kaynağı (scraper) last_success N saat+ eski → warning
    scraper_stale_hours: 24
    # 2026-06-09: Odds API kalan kredi < bu eşik → warning telegram (bitince critical).
    # Bahisçi-fiyatlı marketler (asıl kazanan) bu krediye bağlı; bitmeden haber ver.
    odds_low_credit_threshold: 50
    # SPEC-Z10 (2026-06-03): Kategori-bazli alert mute. ACB/BSL/Lega scraper
    # broken/stale alarmları kullanıcıyı gereksiz gerer çünkü bu lig'ler ML-only
    # (totals/spreads exclude_combos ile kapalı) ve cache yok zaten — broken
    # olması beklenen davranış. VTB cache başarılı build edildi, alarm anlamlı
    # → muted listede YOK. Yeni HTML parser yazılınca ilgili lig listeden çıkar.
    muted_alert_categories:
      - SCRAPER_DOWN_acb_scraper
      - SCRAPER_STALE_acb_scraper
      - SCRAPER_DOWN_bsl_scraper
      - SCRAPER_STALE_bsl_scraper
      - SCRAPER_DOWN_lega_scraper
      - SCRAPER_STALE_lega_scraper

agent:
  cycle_max_consecutive_errors: 2  # programatik hata 2-strike sonrası bot otomatik durur (SPEC-A1)

score:
  enabled: true
  poll_normal_sec: 60          # Light cycle skor poll interval (saniye)
  poll_critical_sec: 30        # Risk fiyatı altında daha sık (SPEC-B)
  critical_price_threshold: 0.35  # Bu fiyatın altındaki pozisyonlar critical

price_feed:
  # SPEC-M (2026-05-19): WS price feed sanity layer (KBO bug fix)
  # Spike rejection: önceki fiyattan >%50 atlama → suspicious, reddet
  max_spike_pct: 0.50
  # Near-resolve spread sanity: ask-bid > 10¢ → likidite yok, sahte tetikleme
  max_spread_for_near_resolve: 0.10
  # 2026-06-08: sıçrama gerçek mi? ask-bid spread bu altındaysa (iki-taraflı tutarlı
  # kota) %50+ hareket KABUL edilir → maç bitince fiyat donmaz. Aksi tek-taraflı → ret.
  max_spike_corroboration_spread: 0.10

# SPEC-Z21 (2026-06-06): basketbol model config bolumu kaldirildi
# (model yok, bahisci konsensusu). exit_basketball/scanner ayri.
mlb_submarket:
  enabled: false              # SPEC-Y7 (2026-05-24): GECICI KAPALI. MLB engine her market icin
                              # 25+ API call (lineup/people/weather) yapip heavy cycle'i blokluyor.
                              # 30 market × 30sn = 12+dk bottleneck. 22 May'deki gibi bookmaker path
                              # devre disi MLB submarket trade yok, ama tum diger maclar acilabilir.
  min_edge: 0.05              # Model edge eşiği (Tennis Lab paritesi)
  statsapi_timeout_sec: 10.0
  rate_cache_path: data/mlb_rate_cache.jsonl

tennis:
  # 2026-06-01: Yetki filtresi config'i (önce kod-level sabitti, ARCH_GUARD §6).
  # Glicko phi (rating deviation) eşiği — düşük phi = güvenilir rating (~30+ maç).
  # phi >= bu değer → model konuşmaz, market atlanır.
  max_phi_for_trade: 100.0
  # UNKNOWN damgalı turnuva zemini bu kadar gün sonra Wikipedia'dan tekrar sorgulanır (TTL).
  surface_unknown_recheck_days: 3
  # Polymarket slug bu prefix'lerden biri ile başlıyorsa low-tier (yetki dışı).
  low_tier_slug_prefixes: ["itf-", "challenger-", "futures-"]
  # Question metninde geçerse low-tier (Polymarket bazen "atp-" slug + question'da tier yazıyor).
  # 2026-06-01: Challenger tournament isim pattern'leri için ek keyword'ler.
  low_tier_question_keywords:
    - "ITF"
    - "Futures"
    - "Challenger"
    - "M15"
    - "M25"
    - "W15"
    - "W25"
    - "Prostejov"   # ATP Challenger (Krumich case)
    - "Heraklion"   # ITF Futures
    - "Antalya Challenger"
    - "Cancun Challenger"

paper:
  # 2026-05-29 (unified paper lab Phase 2): real Polymarket fill simulation.
  # tennis-paper-lab config_tennis.yaml ile birebir aynı ayarlar
  # (kanıtlanmış kombinasyon — 10 günde +$122 realized o ayarlarla geldi).
  max_buy_slippage_pct: 0.02     # %2 BUY
  max_sell_slippage_pct: 0.05    # %5 SELL
  min_fill_ratio: 0.95           # %95+ dolduysa FILLED
  book_cache_ttl_sec: 5
  max_open_cycles: 6             # GTC limit ~3sa açık kalır sonra CANCEL
  max_stuck_cycles: 12           # Stuck position alarm eşiği (~1sa)
  min_order_usdc: 1.0            # Polymarket min order
  price_tick: 0.01               # 1¢ tick zorunlu
  maker_fee_pct: 0.0             # Polymarket varsayılan
  taker_fee_pct: 0.0
  polygon_gas_usdc: 0.01         # Polygon gas/order
