# config.yaml — Polymarket Agent 2.0 v2 defaults (TDD §9)
mode: dry_run  # dry_run | paper | live
initial_bankroll: 1000.0

cycle:
  heavy_interval_min: 30
  light_interval_sec: 5
  night_interval_min: 60
  night_hours: [8, 9, 10, 11, 12, 13]

scanner:
  min_liquidity: 1000
  max_markets_per_cycle: 300
  max_duration_days: 14
  # Maç bu kadar saatten uzaksa Odds API h2h verisi yok → scanner'da ele
  max_hours_to_start: 24.0
  # Maç başladıktan sonra max kabul (canlı entry penceresi) (SPEC-B)
  max_post_start_hours: 8.0
  # yes_price >= bu veya <= (1 - bu) → market sonucu belli, skip (Polymarket flag lag)
  resolved_price_threshold: 0.98
  allowed_categories: ["sports"]
  # Gamma event.tags[*].slug formatı (Odds API key ≠ Gamma tag).
  # Odds API mapping domain/matching/odds_sport_keys.py'de ayrı yapılır.
  allowed_sport_tags:
    # 2026-05-11: Sadece basketbol — tek olay swing düşük (sayı = %1-3 fiyat etkisi).
    # Diğer sportlar (NHL/MLB/Tennis/Soccer/NCAAF/Golf) kaldırıldı çünkü
    # tek olay (gol/run/TD/KO) fiyatı %20-100 uçuruyor → bot stop-loss tutamıyor.
    # Audit kanıt: baseball avg %73 kayıp, NHL %46, NBA %35.
    # Basketball
    - nba
    - wnba
    - ncaab
    - cbb
    - wncaab
    - euroleague
    - nbl
    # "basketball" generic dropped: CBA/KBL/VTB no Odds API coverage (SPEC-003)
    # — Aşağıdakiler arşiv (kalıbı ileri açmak istersek):
    # Baseball: mlb, milb, npb, kbo, baseball (kapatıldı 2026-05-11)
    # Ice Hockey: nhl, ahl, liiga, mestis, shl, allsvenskan (kapatıldı 2026-05-11)
    # American Football: ncaaf, cfl, ufl (kapatıldı 2026-05-11)
    # Golf: lpga*, liv*, pga* (kapatıldı 2026-05-11)
    # Tennis kaldırıldı 2026-05-05 — matching katmanı korundu
    # Combat sports kaldırıldı 2026-05-10 (SPEC-J)

edge:
  min_edge: 0.06
  confidence_multipliers:
    A: 1.25
    B: 1.00

risk:
  max_single_bet_usdc: 50
  max_bet_pct: 1.0  # disabled - max_single_bet_usdc tek kural
  max_positions: 50        # Kozmetik cap — pratikte exposure_pct + bet_pct dominant (~12-15 aktif poz)
  max_positions_per_event: 2  # ARCH Kural 8 (gevşedi): aynı event'te max 2 bağımsız market (moneyline + spread/totals)
  max_exposure_pct: 0.50
  hard_cap_overflow_pct: 0.02   # soft cap üstüne +%2 buffer (hard cap = %52)
  min_entry_size_pct: 0.015     # min pozisyon = bankroll × %1.5 (tx-cost floor)
  max_entry_price: 0.88    # 88¢+ girişlerde R/R kötü (max payout 0.99-entry)
  consecutive_loss_cooldown: 3
  cooldown_cycles: 2
  stop_loss_pct: 0.30
  min_scale_out_realized_usdc: 7.0  # Tier 1/2 realized < $7 ise scale-out skip (küçük kârları zorlama)

early:
  enabled: true
  max_slots: 2
  max_entry_price: 0.70
  min_edge: 0.10
  min_anchor_probability: 0.55
  min_confidence: "B"
  bookmaker_pre_screen_edge: 0.08
  min_hours_to_start: 6.0
  max_hours_to_start: 24.0
  bet_pct: 0.05
  stop_loss_pct: 0.30

consensus:
  enabled: true
  min_price: 0.60
  bet_pct: 0.05
  max_slots: 5

stock:
  enabled: true
  jit_batch_multiplier: 3       # empty_slots × bu = her cycle enrich edilecek tavan
  ttl_hours: 24.0               # first_seen üzerinden stock'ta kalma limiti
  pre_match_cutoff_min: 30.0    # match_start'a bu dk kala düş
  max_no_edge_attempts: 3       # peş peşe bu kadar no_edge → düş

scale_out:
  enabled: true
  tiers:
    - threshold: 0.25
      sell_pct: 0.40
    - threshold: 0.50
      sell_pct: 0.50

circuit_breaker:
  daily_max_loss_pct: -0.08
  hourly_max_loss_pct: -0.05
  consecutive_loss_limit: 4
  cooldown_after_daily_min: 120
  cooldown_after_hourly_min: 60
  cooldown_after_consecutive_min: 60
  entry_block_threshold: -0.03
  # Dashboard Loss Protection renk bölgeleri (drawdown %)
  safe_drawdown_pct: 15.0
  warn_drawdown_pct: 30.0

manipulation:
  min_liquidity_usd: 10000

liquidity:
  entry_min_depth_usdc: 100
  entry_halve_threshold: 0.20
  exit_min_fill_ratio: 0.80

near_resolve:
  threshold_cents: 94
  pre_match_guard_minutes: 10   # WS spike guard — ilk 10dk'da 94¢ sinyali gerçek değil, spike

a_conf_hold:
  min_entry_price: 0.60
  market_flip_threshold: 0.50
  market_flip_elapsed_gate: 0.85

favored:
  promote_eff_price: 0.65
  demote_eff_price: 0.65
  conf_required: ["A", "B"]

dashboard:
  enabled: true
  host: "127.0.0.1"
  port: 5050

telegram:
  enabled: false
  bot_token: ""
  chat_id: ""

agent:
  cycle_max_consecutive_errors: 2  # programatik hata 2-strike sonrası bot otomatik durur (SPEC-A1)

score:
  enabled: true
  poll_normal_sec: 60          # Light cycle skor poll interval (saniye)
  poll_critical_sec: 30        # Risk fiyatı altında daha sık (SPEC-B)
  critical_price_threshold: 0.35  # Bu fiyatın altındaki pozisyonlar critical

odds_api:
  # SPEC-K: bookmaker spread/totals line ile Polymarket line tolerance (puan).
  # Bookmaker line target ± bu kadar içinde değilse o bookmaker skip.
  spread_totals_line_tolerance: 0.5
